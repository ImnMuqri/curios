            callback:
              description: |-
                URL that will receive a POST request with the related object's (e.g. Purchase for `purchase.*` webhooks) data in body when any of the events configured on this webhook are triggered.

                The URL must not contain an explicit port. Only the scheme's default port is usable (`http` on 80, `https` on 443), and a URL that spells the port out is rejected with `webhooks_callback_port` - including `:80` and `:443`. Only the `http` and `https` schemes are supported; any other scheme is rejected with `webhooks_callback_scheme`.
