  /public_key/:
    get:
      description: |-
        Returns public key for authenticating company callback payloads.

        The response body is a JSON-encoded PEM string (e.g.
        `"-----BEGIN PUBLIC KEY-----..."` with surrounding quotes), not a
        bare PEM body and not a `{"key": ...}` object. `json_decode` the
        response body before passing it to your crypto library.
