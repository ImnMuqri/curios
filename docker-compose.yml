services:
  postgres:
    image: postgres:16-alpine
    container_name: curios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: curios
      POSTGRES_PASSWORD: curios
      POSTGRES_DB: curios
    ports: ['5452:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U curios -d curios']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    container_name: curios-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: curios
      POSTGRES_PASSWORD: curios
      POSTGRES_DB: curios_test
    ports: ['5453:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U curios -d curios_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: curios-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ['6399:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
