  big:`<div class="big"><div class="top"><span>Order #16 · Aida</span><span class="pill paid">Paid · FPX</span></div><p class="n">RM103</p><div class="ol"><span>1× Kek coklat moist 1kg</span><span>RM95</span></div><div class="ol"><span>1× Lilin &amp; topper</span><span>RM8</span></div><div class="ol tot"><span>Pickup</span><span>Sat 31 Oct, 11am</span></div></div>`,
  list:[['M','#15 Mira · Kek batik ×2','Delivery · Klang','<span class="pill hot">Paid</span>'],['F','#14 Farah · Raya set','Pickup · Sun','<span class="pill hot">Paid</span>']],
  c0:['Your inbox today','32 unread, all asking the same things. Few pay.'],cM:['Now your page replies','Every chat answered. Ready buyers order and pay.'],c1:['Orders, already paid','Straight from the chat. No “transfer dulu ya”.'],
  q:'Kek birthday budak bawah RM100?',who:'Kek Lina’s page',ans:'Kids love these:',
  cards:[['linear-gradient(135deg,#7a3b2a,#3d1a12 60%,#f6c9d5)','Coklat moist','RM95','Add','✓ Added'],['linear-gradient(135deg,#d9b48a,#5a3a22 70%)','Kek batik','RM45','Add']],pick:0,
  t2:['Products, suggested','It picks from your shop, at your prices.'],
  notifs:[['10:40 pm','Follow up: wants 3 Raya sets for the office, asked for a bulk price'],['11:58 pm','New order #16 · RM103 paid · pickup Sat']],
  t3:['Told the moment it matters','New orders and buyers to follow up ping you.'],
  bars:[['“Ada delivery ke Klang?”',14],['“Boleh tulis nama atas kek?”',12],['“Ada yang tak manis sangat?”',8],['“Ada kek pandan?”',5,'Not on your menu yet']],
  t4:['What buyers keep asking, answered','And what they want that you don’t sell yet.']}
};
const $=id=>document.getElementById(id);
let epoch=0;
const sleep=(ms,e)=>new Promise((res,rej)=>setTimeout(()=>e===epoch?res():rej('x'),ms));
function loop(fn,e){(async()=>{try{for(;;)await fn(e)}catch(_){}})()}

function render(p){
 const d=D[p],sec=$('sec');
 for(const k of['dark','tint','acc','acc2','bar'])sec.style.setProperty('--'+k,d[k]);
 $('lede').textContent=d.lede;
 [['c0',d.c0],['c1',d.c1],['t2',d.t2],['t3',d.t3],['t4',d.t4]].forEach(([k,v])=>{$(k+'b').textContent=v[0];$(k+'s').textContent=v[1]});
 $('t2').style.background=d.tint;
 $('aft').innerHTML=d.big+d.list.map(l=>`<div class="li"><i>${l[0]}</i><span class="x">${l[1]}<small>${l[2]}</small></span>${l[3]}</div>`).join('');
 $('bars').innerHTML=d.bars.map(b=>`<div class="bar${b[2]?' miss':''}"><span>${b[0]}</span><span class="tr"><i></i>${b[2]?`<span class="flag">${b[2]}</span>`:''}</span><em>0</em></div>`).join('');
}

const waRow=c=>`<i></i><span class="x"><b>${c[4]}</b><span>${c[0]}</span></span><span class="r"><small>${c[1]}</small><em>${c[5]}</em></span>`;
const cuRow=(c,d)=>`<i></i><span class="x"><b>“${c[0]}”</b><span>Visitor from ${c[2]}</span></span><span class="r"><small>${c[1]}</small></span><span class="ok">${c[3]?d.keepT:d.okT}</span>`;
async function tall(e){
 const d=D[cur],t=$('t1'),bef=$('bef');
 t.className='tile tall';
 bef.innerHTML=d.chats.map(c=>`<div class="wl wap${c[3]?' k':''}">${waRow(c)}</div>`).join('');
 const rows=[...bef.children];
 $('tagT').textContent=d.tagB;$('c0b').textContent=d.c0[0];$('c0s').textContent=d.c0[1];
 await sleep(500,e);
 for(const r of rows){r.classList.add('in');await sleep(230,e)}
 for(let k=0;k<5;k++){await sleep(420,e);const r=rows[(k*3+1)%rows.length],em=r.querySelector('em');em.textContent=+em.textContent+1;em.classList.remove('pop');void em.offsetWidth;em.classList.add('pop')}
 await sleep(700,e);
 t.classList.add('cur');$('tagT').textContent=d.tagM;
 const cap=t.querySelector('.c0');cap.style.opacity=0;
 for(const r of rows){r.classList.add('flip');await sleep(90,e)}
 await sleep(150,e);
 $('c0b').textContent=d.cM[0];$('c0s').textContent=d.cM[1];cap.style.opacity='';
 for(const [i,r] of rows.entries()){r.innerHTML=cuRow(d.chats[i],d);r.classList.remove('wap');r.classList.remove('flip');await sleep(90,e)}
 await sleep(500,e);
 t.classList.add('sort');
 await sleep(600,e);
 for(const r of rows){r.classList.add(r.classList.contains('k')?'keep':'done');await sleep(200,e)}
 await sleep(1400,e);
 t.classList.remove('sort','cur');t.classList.add('after');$('tagT').textContent=d.tagA;
 await sleep(5200,e);
}
async function chat(e){
 const d=D[cur],c=$('chat'),pick=d.pick??1;
 c.innerHTML=`<span class="q">${d.q}</span><span class="a dots-w" data-n="${d.who}"><span class="dots"><i></i><i></i><i></i></span></span><div class="cards">${d.cards.map(k=>`<span class="c"><u style="background:${k[0]}"></u><b>${k[1]}</b>${k[2]}<em>${k[3]}</em></span>`).join('')}</div>`;
 const [q,a,cards]=c.children;
 await sleep(500,e);q.classList.add('in');
 await sleep(700,e);a.classList.add('in');
 await sleep(1100,e);a.textContent=d.ans;
 await sleep(250,e);cards.classList.add('in');
 await sleep(1300,e);
 const b=cards.children[pick].querySelector('em');b.classList.add('press');
 await sleep(160,e);b.classList.remove('press');b.classList.add('on');b.textContent=d.cards[pick][4];
 await sleep(3000,e);
 [...c.children].forEach(x=>x.classList.remove('in'));
 await sleep(500,e);
}
async function notifs(e){
 const d=D[cur],s=$('stack');s.innerHTML='';
 const mk=n=>{const el=document.createElement('div');el.className='nt enter';el.innerHTML=`<span class="ic">${ICON}</span><span style="flex:1"><b>Curios <small>${n[0]}</small></b>${n[1]}</span>`;s.prepend(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('enter')));return el};
 await sleep(900,e);
 const a=mk(d.notifs[0]);
 await sleep(2200,e);
 a.classList.add('back');const b=mk(d.notifs[1]);
 await sleep(3600,e);
 a.classList.add('gone');b.classList.add('gone');
 await sleep(600,e);
}
async function bars(e){
 const d=D[cur],rows=[...$('bars').children],max=d.bars[0][1];
 rows.forEach(r=>{r.classList.remove('flagged');r.querySelector('i').style.width='0';r.querySelector('em').textContent='0'});
 await sleep(700,e);
 rows.forEach((r,i)=>setTimeout(()=>{if(e!==epoch)return;const v=d.bars[i][1];r.querySelector('i').style.width=(v/max*100)+'%';
  let n=0;const em=r.querySelector('em'),id=setInterval(()=>{if(e!==epoch||n>=v)return clearInterval(id);em.textContent=++n},800/v)},i*180));
 await sleep(1900,e);
 rows.forEach(r=>{if(r.classList.contains('miss')){r.classList.add('flagged');r.querySelector('.flag').style.left=r.querySelector('i').style.width}});
 await sleep(4200,e);
}
let cur='svc';
function start(p){cur=p;const e=++epoch;render(p);loop(tall,e);loop(chat,e);loop(notifs,e);loop(bars,e)}
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x===b));start(b.dataset.p)});
start('svc');
</script>
